<!DOCTYPE html>
<html>

<head>
    <title>Number Guessing Game - Aniket Sharma</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f7fb;
            padding-top: 50px;
        }

        .game {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #1d4ed8;
            color: white;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Number Guessing Game</h1>

        <p>Guess the number between 1 and 20</p>

        <p id="attempts">Attempts left: 3</p>

        <input type="number" id="guess" placeholder="Guess the number">

        <br>

        <button onclick="checkGuess()">Guess</button>

        <h3 id="result"></h3>

    </div>


    <script>

        let secret = 16;
        let attempts = 3;

        function checkGuess() {

            let guess = Number(document.getElementById("guess").value);

            document.getElementById("attempts").innerText =
                "Attempts left: " + attempts;

            if (guess == secret) {

                document.getElementById("result").innerText =
                    "Correct guess! You won the game. Attempts=" + attempts;

            }

            else if (guess < secret) {

                document.getElementById("result").innerText =
                    "Too low. Try again.";

                attempts = attempts - 2;

            }

            else {

                document.getElementById("result").innerText =
                    "Too high. Try again.";

                attempts = attempts - 2;

            }

            if (attempts <= 0 && guess != secret) {

                document.getElementById("result").innerText =
                    "Game over! The number was " + secret;

            }

            document.getElementById("attempts").innerText =
                "Attempts left: " + attempts;
        }

    </script>

</body>

</html>
